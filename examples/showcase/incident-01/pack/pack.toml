# 演示领域包：离线日志根因定位（**只读**）。
#
# 与 coding-readonly 一样，只声明只读工具与只读能力，且只把只读工具声明为 low。
# 写文件 / 执行命令在演示里一律不授予：演示的看点是"受限资源下把只读证据用起来"，
# 不是"给模型更大权限"。把 run_command / write_file 声明成 low 属降级安全默认，
# 必须先走 ADR（docs/engineering/product-handbook.md §4.4）。

[pack]
name = "incident-triage"
version = "0.1.0"
description = "离线日志根因定位（只读）：读取现场日志与配置，给出可核对的结论。"

[prompt]
fragments = [
    "本领域包只授予只读能力：可以读取文件与列出目录，不能写入文件，也不能执行命令。",
    "结论必须来自工具真实读到的内容；每个取值都要能从文件原文复核，找不到依据时明确说明。",
    "任务点名了几个文件，就必须逐个读取；少读一个即视为未完成，不得用推测填补缺项。",
]

[tools]
allowlist = ["read_file", "list_dir"]

[security]
capabilities = ["read_file"]

[security.risk_overrides]
read_file = "low"
list_dir = "low"

[output]
format = "markdown"
