# ============================================================================
# CNB 云原生构建流水线
#
# 定位：**轻量质量门禁 + 云原生开发环境**。本文件中的命令必须与 Makefile 保持一致，
#       Makefile 是唯一事实来源，禁止在此另写一套检查逻辑。
#
# 说明：
#   - "**" 为 glob 模式，匹配所有分支（含 main / develop）。
#     多个 glob 规则同时命中时流水线会并行执行，因此这里只保留一条规则，
#     避免重复执行；后续如需为特定分支追加发布任务，再单独新增分支键。
#   - pull_request 属于「不可信事件」（配置取自源分支，存在被篡改风险），
#     因此本流水线中不得使用任何密钥、令牌或敏感凭据。
#     参见：https://docs.cnb.cool/zh/build/trigger-rule.md
#
# 【两条硬规则，2026-09-16 由一次真实故障换来】
#   1. **阶段脚本由镜像的 `/bin/sh` 执行，不得使用 bash 专有语法。**
#      特别是 `set -euo pipefail`：Debian 12 的 dash（0.5.12-2）不支持
#      `set -o pipefail`，会在第一行直接报 `sh: 1: set: Illegal option -o pipefail`
#      并以退出码 2 中止——连后续 stage 都不会执行。因此这里一律写 `set -eu`；
#      需要 pipefail 时显式切到 bash（`if [ -n "${BASH_VERSION:-}" ]`）。
#      注意：`make` 目标本身走 bash（Makefile 里 `SHELL := /bin/bash`），不受影响。
#   2. **镜像不得使用浮动标签。** 原先写 `python:3.12`，该标签已从 Debian 12
#      （bookworm，dash 0.5.12-2）漂到 Debian 13（trixie，dash 0.5.12-12，
#      支持 pipefail）——同一份配置在不同时间行为不同，且与开发镜像
#      （`.ide/Dockerfile` 的 `FROM python:3.12-bookworm`）分叉。
#      现统一为 `python:3.12-bookworm`，与开发镜像同源。
#      依据与证据：docs/devlog/0012 §5、docs/notes/reproducibility-and-gates.md。
#   3. **流水线里 `make setup` / `make check` 必须带 `LOCAL_HOOKS=0`**（2026-09-18 新增）。
#      本地 git 钩子层（pre-commit / commit-msg）是**开发机**的防线，流水线里没有意义；
#      而 `make check` 现在包含 `hooks-check`（断言钩子真的装了）⇒ 不带该开关会红灯。
#      注意：**不要**把 `LOCAL_HOOKS=0` 理解成"可以随便关"——它是**显式**开关，
#      用来取代原先按 `$CI` 环境变量推断的做法（那个判据把云开发工作区误判成流水线，
#      导致本地钩子从未安装且无人察觉，见一致性报告 A-11/A-15）。
#   4. **合并提交不参与 Conventional Commits 校验**（2026-09-21 新增）。
#      `push` 流水线的 `commit-message` 阶段跑 `cz check --rev-range HEAD~1..HEAD`；
#      而合并提交的信息由平台自动生成（形如「合并来自 develop 的合并请求 #9」），
#      **不是人写的**——Conventional Commits 约束的是人写的提交信息，约束不到平台。
#      不豁免 ⇒ `develop`→`main` 的每一次合并都必然让 main 的 push 流水线红在该阶段
#      （`cz check` 退出码 14 ⇒ `make` 报 `Error 14` ⇒ 阶段退出码 2，耗时 <1 s），
#      而 PR 流水线**没有**这个阶段 ⇒ 症状是「PR 全绿、审查通过、合并后必红」。
#      证据：构建 `cnb-5bp-1k31ffrg4`（PR #9 → 合并提交 `82db7d6`）；
#      PR #7（`7138007`）、PR #8（`14000b3`）同为 `commit-message` 阶段 `error`。
#
# 【2026-09-25 修订（[ADR-0025](docs/adr/0025-benchmark-automation-moves-to-dev-bucket.md)）：
#   跑测**迁回自动化**，但一律走**云原生开发桶**。
#   2026-09-24 那次"自动跑测全部下线"的前提已被推翻两条：
#   ① "自动化 ⇒ 必烧构建桶"不成立（判据是"有没有 `services: [vscode]`"，不是"怎么被触发"）；
#   ② "开发桶超额 157%"是拿 used 比 free 的口径错误（`total` = 17600，余 ≈15000）。
#   ⇒ 真正的硬顶是**构建桶**（`total == free == 160 核时/月），跑测不该占它。】
#   5. **跑测类流水线必须声明 `services: [vscode]`**，否则就掉回构建桶。
#      出处：https://docs.cnb.cool/zh/workspaces/workspace-vs-build.md
#      （"云原生开发本质上是一条声明了 service.vscode 的云原生构建流水线……分配开发节点"）。
#      **已由探针 E1 实测**（`sn=cnb-gnb-1k3ao4u18`）：平台自打标签 `vscode=远程开发`，
#      `ci` 增量仅 +110 s（= 门禁量）而 `dev` 冻结量 +37800 s ⇒ 确实走开发桶。
#      判据由 `tests/unit/test_cnb_config.py` 钉住。
#      `bench/nightly:` 段与 `web_trigger_bench` 仍**退役并归档**（**不是丢弃**：原文逐字
#      保留在 [docs/engineering/archived-ci-benchmark-pipelines.md](docs/engineering/archived-ci-benchmark-pipelines.md)）；
#      `crontab` 仍**不采用**，但理由已变：不是"烧构建桶"，而是**本项目需求是"按需"而非"按点"**
#      （定时不等人、不看当天有没有别的事）。
#   6. **跑测有两个入口**：① 自动化 `api_trigger_bench`（本文件末尾，按分支键分派机器）；
#      ② 人工 `make bench`（在 `vscode` 环境里；入口在 Makefile，实现在
#      `scripts/bench/run.sh`）。⚠️ 两个入口都**必须先有 dev 依赖**：
#      自动化的 `prepare` 阶段跑 `make setup`，人工入口依赖 `vscode` 环境里已跑过它。
#      **缺了它不会报错**——能力判定用的 `mypy` 缺失 ⇒ 通过率**恒为 0%**
#      （2026-09-25 实测：`sn=cnb-8g5-1k3avbsr4` 因此发出了一条 0% 的轮次）。
#      ⚠️ **四道可信闸门不随承载变化而消失**——
#      它们从"流水线的 stage 结构"**迁移为脚本里的断言**，判据不变。
#      闸门清单（KV 重启 / token≥32 且计时行 3 条 / 只暴露中位数+极差 / 入库前 schema 校验）
#      见 docs/research/2026-09-24-ci-consumption-summary.md §5.2。
#      **承载位置变了，判据没变**；少一道，那一轮数据就不可比。
#   6.1 ⚠️ **开发桶环境的释放是"有延迟的自动行为"，不是"跑完即止"（ADR-0025 §2.4）**：
#      stages 跑完**不会立刻**销毁；平台每 **5 分钟**做一次连接检查，
#      在离线宽限期（`keepAliveTimeout`）到期后的**下一个检查点**自动释放
#      ⇒ 实测下界 ≈5 分钟（E2：声明 1m，实际 +5m；E1：声明 20m，实际 +20m）。
#      流水线内 `cnb workspace workspace-stop` 仍因令牌缺**账号级**
#      `account-engage:rw` 被 403 拒绝 ⇒ **想立刻停，只能人工关**。
#      ⇒ 成本 ≈ `cpus` × (跑测时长 + 5 min)，**不是**"到人工关闭为止"；
#      ⇒ 跑测结束**必须人工关闭环境**（账号级令牌自毁属 C 类，待所有者裁决），
#        并用 `make quota` 做月末核对。⚠️ 开发桶超出免费额度部分**按 ¥0.125/核时计费**
#        ——**容量充足 ≠ 免费**。
#   7. **门禁一律单核（`runner.cpus: 1`）**：跑测要起模型、需 8 核 16 GiB，
#      而 lint / typecheck / test / security 单核足矣。不显式声明就等于按平台的
#      **默认 8 核**计费——那是本次盘点里最容易漏算的一项消耗。
#      另加 `ifModify` 限定只在相关路径变更时触发、`lock` 只保留最新一条排队。
# ============================================================================

"**":
  # --------------------------------------------------------------------------
  # 推送：对任意分支的每次提交执行轻量门禁
  #
  # ⚠️ 两条流水线的 `runner` / `ifModify` / `lock` 三块必须**逐字一致**
  #    （由 `tests/unit/test_cnb_config.py` 的
  #     `test_light_gate_is_single_core_path_scoped_and_debounced` 钉住）。
  #    这里**故意用重复文本而不是 YAML 锚点**：锚点要求引用源 key 以 `.` 开头，
  #    而那会被平台当成一个分支名解析——失败模式（"多出一个莫名的分支键"）
  #    比"两处文本分叉"更难排查。分叉风险改由机器检查消除。
  # --------------------------------------------------------------------------
  push:
    - name: ci
      runner:
        # 单核足够：lint / typecheck / test / security 全是静态与轻量用例
        # （本地 `make check` = 957 passed ≈ 9 s）。
        # ⚠️ **不显式声明就等于按平台默认 8 核计费**——这是本次盘点里最容易
        #    漏算的一项消耗（8 核比 1 核贵 8 倍）。
        cpus: 1
      ifModify:
        # 只在代码 / 配置相关路径变更时触发：纯文档提交不再占用任何构建额度。
        # ⚠️ 已知残留缺口：`make check` 的 `format-check` 也覆盖 `docs/`
        #    （ruff 会格式化文档里的 python 围栏代码块），而这里不含 `docs/**`
        #    ⇒ 纯文档提交的门禁改由**本地 pre-commit 钩子**承担
        #    （`.pre-commit-config.yaml` 的 `ruff-format` 不限路径、覆盖暂存文件）。
        #    这是一处**部分缓解**，已登记在 ADR-0023 的负面后果里。
        - "src/**"
        - "tests/**"
        - "scripts/**"
        - "Makefile"
        - "pyproject.toml"
        - "uv.lock"
        - ".pre-commit-config.yaml"
        - ".cnb.yml"
      lock:
        # 排队而不是堆积：同一时刻只跑一条轻门禁，且只保留**最新**的一条排队者。
        # 1 核的流水线若无人清理会排成一条长队，按秒计费时那也是实打实的核时。
        key: ci-gate
        wait: true
        cancel-in-wait: true
      docker:
        image: python:3.12-bookworm
      stages:
        - name: prepare
          script: |
            set -eu
            command -v make >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make)
            make setup LOCAL_HOOKS=0

        - name: verify
          script: |
            set -eu
            make check LOCAL_HOOKS=0

        - name: secret-scan
          script: |
            set -eu
            # 密钥扫描做成**独立具名 stage**（而不是只藏在 make check 的 security 聚合里）：
            # 一致性报告 A-15 要求"声称已生效的缓解措施"可被**实测确实在运行**，
            # 而"CI 里到底有没有这道扫描"只有具名 stage 能在流水线上被直接看到。
            # 命令复用 Makefile 的同一个目标（唯一事实来源），不在此另写一套。
            make security-secrets

        - name: commit-message
          script: |
            set -eu
            # 仅在非首个提交时校验提交信息规范
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              # 合并提交不校验（头部硬规则 4）：它的信息由平台生成，不是人写的。
              # 判据 = 存在第二父提交；squash 合并（单父）仍走校验，因为那条信息是人填的。
              if git rev-parse --verify --quiet "HEAD^2" >/dev/null; then
                echo ">> 合并提交，跳过提交信息校验"
              else
                make commit-check
              fi
            else
              echo ">> 仓库首个提交，跳过提交信息校验"
            fi

        - name: branch-status
          script: |
            set -eu
            # 只报告，不阻断：分支卫生是提醒而非质量门禁（ADR-0013）。
            # 需要真正阻断时改用 `make branch-status STRICT=1`（脚本 --strict）。
            make branch-status || echo "[warn] 分支自检未完成"

  # --------------------------------------------------------------------------
  # 合并请求：源分支每次推送都会重新执行
  #
  # 与 `push` 的三块（runner / ifModify / lock）**逐字一致**，理由见上。
  # PR 事件触发最频繁，因此这里最省的就是"单核 + 路径过滤 + 只留最新一条"。
  # --------------------------------------------------------------------------
  pull_request:
    - name: ci-pr
      runner:
        cpus: 1
      ifModify:
        - "src/**"
        - "tests/**"
        - "scripts/**"
        - "Makefile"
        - "pyproject.toml"
        - "uv.lock"
        - ".pre-commit-config.yaml"
        - ".cnb.yml"
      lock:
        key: ci-gate
        wait: true
        cancel-in-wait: true
      docker:
        image: python:3.12-bookworm
      stages:
        - name: prepare
          script: |
            set -eu
            command -v make >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make)
            make setup LOCAL_HOOKS=0

        - name: verify
          script: |
            set -eu
            make check LOCAL_HOOKS=0

        - name: secret-scan
          script: |
            set -eu
            # 与 push 流水线同一条具名阶段，理由见上（A-15：缓解措施必须可实测）。
            # 本阶段**不使用任何凭据**，符合"不可信事件不得访问密钥"的约束（SECURITY.md S-5）。
            make security-secrets

  # --------------------------------------------------------------------------
  # 云原生开发：从页面启动 WebIDE / VS Code Remote-SSH 时使用自定义开发环境
  #
  # 说明：
  #   - 镜像由 .ide/Dockerfile 构建；首次约 5~15 分钟，之后推送至制品库复用。
  #   - build.by 必须声明构建期用到的其它文件（.ide/settings.json），
  #     否则构建报错 —— 这是 CNB 的硬性约束。
  #   - image 为构建失败时的回退镜像。
  #   - services [vscode, docker]：分别启用 VS Code 服务与容器内 docker 命令。
  #   - 该事件下的 stages 会在开发环境启动后自动执行（此处仅做环境自检输出）。
  #   - ⚠️ 本事件走的是**云原生开发**额度（1600 核时/月），**不是**云原生构建额度
  #     （160 核时/月）；两者是官方计费表里分列的独立计费项。见
  #     docs/research/2026-09-24-ci-consumption-summary.md §4.4。
  #   - ⚠️ **不要频繁改本段的 `build.by` / `.ide/Dockerfile`**：每改一次，
  #     所有环境下次拉起都要重建镜像（多花一次构建）。只改文档 / 代码时**不必**动它。
  # --------------------------------------------------------------------------
  vscode:
    - name: dev-env
      runner:
        # 8 核 / 16 GiB 内存。免费额度为云原生开发-CPU 1600 核时/月，
        # 按 8 核 × 每天 8 小时 × 22 个工作日 = 1408 核时，属于可持续用量。
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          # build.by 必须列出**构建期用到的所有文件**，否则构建报错（CNB 硬性约束）。
          # 预置资产的清单与获取脚本（见 Dockerfile 第 10/11/12 阶段）。
          # 改动这些文件会改变构建输入 → 触发镜像重建。
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
            - .ide/install-cnb-skills.sh
            - .ide/assets/cnb-skills.txt
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: welcome
          script: |
            set +e
            echo "=================================================="
            echo " 开发环境已就绪（自定义镜像 .ide/Dockerfile）"
            echo "=================================================="
            printf 'python : %s\n' "$(python -V 2>&1)"
            printf 'uv     : %s\n' "$(uv --version 2>&1)"
            printf 'node   : %s\n' "$(node -v 2>&1)"
            printf 'pnpm   : %s\n' "$(pnpm --version 2>&1)"
            printf 'cmake  : %s\n' "$(cmake --version 2>&1 | head -n1)"
            printf 'bwrap  : %s\n' "$(command -v bwrap || echo '缺失')"
            printf 'llama  : %s\n' "$(command -v llama-server || echo '缺失')"
            printf 'codebuddy: %s\n' "$(codebuddy --version 2>&1 | head -n1)"
            echo "--------------------------------------------------"
            echo "首次使用请执行：make setup && make check"
            echo "跑测（人工一键，含四道可信闸门）：make bench"
            echo "=================================================="

        - name: branch-hygiene
          script: |
            set +e
            # 为什么放在这里：开发环境每次从 develop 拉起、重启即清空上下文，
            # 未合入 develop 的工作在**下一次会话中不可见**（ADR-0013、devlog 0011）。
            # 放在启动阶段而不是靠人记，是这次丢内容事故的直接对策。
            # 只报告，不阻断——它不是质量门禁。
            echo "--------------------------------------------------"
            echo " 分支卫生自检（未合入 develop 的工作）"
            echo "--------------------------------------------------"
            make branch-status || echo "[warn] 分支自检未执行（不影响开发）"

        - name: local-hooks
          script: |
            set -eu
            # 启动期断言：**声称已生效的本地防线必须真的在**（一致性报告 A-15）。
            # 判据：`.venv` 存在 ⇒ 工作区已准备（`make setup` 跑过）⇒ 此时钩子缺失就是缺陷，红灯；
            #       `.venv` 不存在 ⇒ 尚未准备，没有可断言的义务 ⇒ 只给出提示，不判红
            #       （否则每次新会话都恒红，红灯会被当成背景噪声——那比不检查更糟）。
            echo "--------------------------------------------------"
            echo " 本地钩子层自检（pre-commit / commit-msg 是否真的已安装）"
            echo "--------------------------------------------------"
            if [ ! -d .venv ]; then
              echo "[info] 工作区尚未准备（无 .venv）：先执行 make setup，再复验本地钩子层"
            else
              make hooks-check
            fi

# ============================================================================
# TODO（随项目推进补充，需先确认 CNB 语法）：
#   - 发布流程：tag_push "v*" → 构建制品 + 生成发布说明
#   - 安全扫描：SCA 依赖与许可证扫描（PR 增量）
#   - 定时任务：每周依赖更新检查
#
# ⚠️ 已**移除**的项（理由见头部硬规则 5；"不得加回"**只对前两条**成立）：
#   - 基准 nightly / deep / push 流水线（走构建桶 ⇒ 不再采用）
#   - `web_trigger_bench` 页面手动补跑（与 `api_trigger_bench` 重叠，且不可编程）
#   - 任何 `crontab` 触发的跑测（需求是"按需"，不是"按点"——理由已于 09-25 变更）
#   - "基准数据保留期检查"（保留期清理改由 `make bench` 在数据分支的工作副本上做）
# ============================================================================

# ============================================================================
# 【跑测段 · 2026-09-25】按分支键分派机器，**走云原生开发桶**
# 决策：[ADR-0025](docs/adr/0025-benchmark-automation-moves-to-dev-bucket.md)
# 证据：docs/research/2026-09-25-bucket-attribution-probe.md §7
#
# 触发（**显式**，不会自己跑）：
#   cnb build start-build --repo <slug> --branch test/amd64-8 --event api_trigger_bench
#
# 四条"为什么"：
#   · 必须声明 `services: [vscode]` —— 那是走开发桶的**唯一**判据（头部硬规则 5）；
#     去掉它就掉回构建桶（硬顶 160 核时/月）。
#   · 分支键用**精确名**（`test/amd64-8`）而不是通配符 —— 机器规格按分支分派，
#     分支上仍**零提交**（CODEBUDDY.md §2），配置全部集中在 `develop` 的这个文件中。
#   · 不用 `branch.create` —— 它会为**每一个**新建分支拉起环境，副作用不可控。
#   · 不用 `crontab` —— 本项目需求是"按需"，不是"按点"（定时不等人）。
#
# ⚠️ 四条实测得到的硬约束（ADR-0025 §2.3~§2.5，改这段前必须读）：
#   ① 环境**会**在 stages 跑完后自动释放，但有 ≈5 分钟延迟（一个连接检查周期）
#      ⇒ 成本 ≈ cpus × (跑测时长 + 5 min)；想立刻停仍需人工关（头部硬规则 6.1）；
#   ② `keepAliveTimeout` = **离线宽限期**（**不是**总时长），应设**小值**：
#      设大了（如 90m）环境就白活那么久——E1（20m→+20m）/E2（1m→+5m）已实测；
#   ③ 单片内**输出间隔必须 < 10 分钟**（grammar.md §Job 的"无输出超时"），
#      故下面起了一个每 60 s 打印时间戳的后台循环——它**不是**伪造 http/ssh 心跳，
#      只是满足超时判据；
#   ④ **产物外推必须在 `stages` 内完成** —— `endStages` 是**销毁前**钩子，
#      而销毁时机不可控（实测 stages 结束后查它返回"没有查询到该 stage 信息"）。
#
# ⚠️ 目前只落地 **amd64-8** 一台机器：arm64 需先验证 `.ide/Dockerfile`
#     （内含预置的模型与 llama-server）能在 arm64 上构建，**未验证前不得照抄本段**。
# ============================================================================
test/amd64-8:
  api_trigger_bench:
    - name: bench-amd64-8
      runner:
        tags: cnb:arch:amd64
        # 8 核 / 16 GiB：L 档常驻 8.70 GiB，4 核（8 GiB）会 OOM（ADR-0024 的 D-C2）
        cpus: 8
      services:
        # ⚠️ 这一行是"走开发桶"的判据，**不要删**（头部硬规则 5）。
        # keepAliveTimeout = **离线宽限期**，不是总时长（2026-09-25 探针 E1/E2 实测）：
        #   E2：声明 1m，计时基准 07:22:39 → 判定释放 07:27:39（**+5m**）
        #   E1：声明 20m，计时基准 06:31:45 → 判定释放 06:51:45（+20m，精确）
        # ⇒ 平台每 **5 分钟**做一次连接检查（`check-is-remote-connections`）：
        #   实际释放 = 基准 + max(声明值, 一个检查周期) ⇒ **下界 5 分钟，设再小也没用**。
        # ⇒ 故设**小值**：环境在 stages 跑完约 5 分钟后自动释放，空转 ≈0.7 核时（8 核）。
        # ⚠️ 设成 90m 会让环境白活 90 分钟（≈12 核时）——这是本次实测纠正掉的错误。
        - name: vscode
          options:
            keepAliveTimeout: 5m
      docker:
        # 与 `vscode` 段的镜像同源（含预置模型与 llama-server）⇒ 命中构建缓存。
        # ⚠️ by 列表必须与 `vscode` 段**逐字一致**，否则镜像版本会分叉。
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
            - .ide/install-cnb-skills.sh
            - .ide/assets/cnb-skills.txt
        image: cnbcool/default-dev-env:latest
      lock:
        # 并发测量会互抢 CPU ⇒ 吞吐数字失去可比性。这是**数据有效性**要求，不是省钱。
        # （ADR-0023 §4.2 曾把这条记为"退化为纪律"，自动化后恢复为机制。）
        key: bench-cpu
        wait: true
      stages:
        - name: prepare
          script: |
            set -eu
            # ⚠️ 这一步不能省（2026-09-25 实测教训，sn=cnb-8g5-1k3avbsr4）：
            # 能力判定要跑 `mypy --strict`，而 `mypy` 属于
            # `[project.optional-dependencies].dev`，**只有 `make setup` 会装**
            # （`uv sync --extra dev --extra security`）。缺了它的症状是**静默**的：
            # 每个任务的 `mypy_rc=1`（No module named mypy）⇒ **能力通过率恒为 0%**，
            # 而四道闸门全过、构建全绿、报告 §4 还写着"无告警"——典型坏数据。
            # 归档的 `bench/nightly` 各段都有这一步；本次重构漏掉了它。
            # 判据由 tests/unit/test_cnb_config.py 钉住。
            make setup LOCAL_HOOKS=0

        - name: run
          script: |
            set -eu
            ( while true; do echo "[bench] alive $(date -u +%FT%TZ)"; sleep 60; done ) &
            HB=$!
            trap 'kill "$HB" 2>/dev/null || true' EXIT
            make bench \
              BENCH_TIERS="${BENCH_TIERS:-S,M,L}" \
              BENCH_REPEATS="${BENCH_REPEATS:-10}" \
              BENCH_LABEL="${BENCH_LABEL:-amd64-8}" \
              BENCH_DATA_ROOT="${BENCH_DATA_ROOT:-${PWD}/.bench-data}"
            kill "$HB" 2>/dev/null || true
      endStages:
        # ⚠️ 这里**不依赖**它做产物外推（见本段注释 ④）：
        # 实测它**确实会执行**（探针 E1：`[probe][endStages] 2026-09-24T22:53:52Z`，
        # 且在 vscode 服务停止之前）⇒ 可作**最后一道兜底**；
        # 但它的触发时机由平台决定（离线宽限期到期）⇒ **不得**作为唯一外推点。
        - name: remind-close
          script: |
            set +e
            echo "=================================================="
            echo " 跑测流程已结束。环境将在 keepAliveTimeout 到期后由平台释放；"
            echo " 若需立即停止计费，请到云原生开发页面手动关闭本环境。"
            echo "=================================================="


# ============================================================================
# 【探针段 · E2】验证 `keepAliveTimeout` 是不是"stages 跑完之后"的宽限期
#
# 判据（来自 E1 的 beforeEnd 日志，2026-09-25）：
#   Maximum available: 18h / Offline recycling: 20m
#   The user has been offline (not more than 20m) waiting for the user to connect.
#   The user has been offline (more than 20m) and starts to release the workspace.
# 计时基准 ≈ stages 收尾/首次连接检查（06:31:45），**不是**环境创建时刻（06:21:32）
# ⇒ 若成立，则 keepAliveTimeout 应设**小值**，环境即可"跑完自动释放"。
#
# 本探针：stages 跑 2 分钟 + keepAliveTimeout: 1m
#
# ✅ **结果（2026-09-25 07:2x）**：假设成立，且比假设更精确——
#   `Offline recycling: 1m`（声明生效）；计时基准 07:22:39 → 判定释放 07:27:39（**+5m**）；
#   `endStages` 于 23:29:44Z 执行；总时长 **7.3 min**，`metricCoreHours: 0.12`。
#   ⇒ **下界是一个检查周期（5 分钟）**：声明值小于它时按 5 分钟走。
#   ⇒ 正式跑测段的 90m 已据此改为 **5m**（白活 90 分钟 ≈12 核时是纯浪费）。
#
#   · 若释放在 stages 结束后 ≈5 分钟 ⇒ 假设成立（已成立）
#   · 若仍存活很久 ⇒ 假设不成立，维持"人工关闭为默认"
#
# ⚠️ 分支键用精确名 `test/keepalive-probe`：与 `test/amd64-8` 不重叠
#    （多个 glob 同时命中会并行执行，见头部第 8 行）。
# ============================================================================
test/keepalive-probe:
  api_trigger_keepalive_probe:
    - name: keepalive-probe
      runner:
        cpus: 1
      services:
        - name: vscode
          options:
            keepAliveTimeout: 1m
      docker:
        image: python:3.12-bookworm
      stages:
        - name: probe-short
          script: |
            set -eu
            echo "[probe2] start       $(date -u +%FT%TZ)"
            i=0
            while [ "$i" -lt 2 ]; do
              echo "[probe2] t+${i}min   $(date -u +%FT%TZ)"
              i=$((i + 1))
              sleep 60
            done
            echo "[probe2] stages-done $(date -u +%FT%TZ)"
      endStages:
        - name: probe-end
          script: |
            set -eu
            echo "[probe2][endStages]  $(date -u +%FT%TZ)"
