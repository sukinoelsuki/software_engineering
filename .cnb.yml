# ============================================================================
# CNB 云原生构建流水线
#
# 定位：CI 门禁。本文件中的命令必须与 Makefile 保持一致，
#       Makefile 是唯一事实来源，禁止在此另写一套检查逻辑。
#
# 说明：
#   - "**" 为 glob 模式，匹配所有分支（含 main / develop）。
#     多个 glob 规则同时命中时流水线会并行执行，因此这里只保留一条规则，
#     避免重复执行；后续如需为特定分支追加发布任务，再单独新增分支键。
#   - pull_request 属于「不可信事件」（配置取自源分支，存在被篡改风险），
#     因此本流水线中不得使用任何密钥、令牌或敏感凭据。
#     参见：https://docs.cnb.cool/zh/build/trigger-rule.md
#
# 【两条硬规则，2026-09-16 由一次真实故障换来】
#   1. **阶段脚本由镜像的 `/bin/sh` 执行，不得使用 bash 专有语法。**
#      特别是 `set -euo pipefail`：Debian 12 的 dash（0.5.12-2）不支持
#      `set -o pipefail`，会在第一行直接报 `sh: 1: set: Illegal option -o pipefail`
#      并以退出码 2 中止——连后续 stage 都不会执行。因此这里一律写 `set -eu`；
#      需要 pipefail 时显式切到 bash（`if [ -n "${BASH_VERSION:-}" ]`）。
#      注意：`make` 目标本身走 bash（Makefile 里 `SHELL := /bin/bash`），不受影响。
#   2. **镜像不得使用浮动标签。** 原先写 `python:3.12`，该标签已从 Debian 12
#      （bookworm，dash 0.5.12-2）漂到 Debian 13（trixie，dash 0.5.12-12，
#      支持 pipefail）——同一份配置在不同时间行为不同，且与开发镜像
#      （`.ide/Dockerfile` 的 `FROM python:3.12-bookworm`）分叉。
#      现统一为 `python:3.12-bookworm`，与开发镜像同源。
#      依据与证据：docs/devlog/0012 §5、docs/notes/reproducibility-and-gates.md。
# ============================================================================

"**":
  # --------------------------------------------------------------------------
  # 推送：对任意分支的每次提交执行完整门禁
  # --------------------------------------------------------------------------
  push:
    - name: ci
      docker:
        image: python:3.12-bookworm
      stages:
        - name: prepare
          script: |
            set -eu
            command -v make >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make)
            make setup

        - name: verify
          script: |
            set -eu
            make check

        - name: commit-message
          script: |
            set -eu
            # 仅在非首个提交时校验提交信息规范
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              make commit-check
            else
              echo ">> 仓库首个提交，跳过提交信息校验"
            fi

        - name: branch-status
          script: |
            set -eu
            # 只报告，不阻断：分支卫生是提醒而非质量门禁（ADR-0013）。
            # 需要真正阻断时改用 `make branch-status STRICT=1`（脚本 --strict）。
            make branch-status || echo "[warn] 分支自检未完成"

  # --------------------------------------------------------------------------
  # 合并请求：源分支每次推送都会重新执行
  # --------------------------------------------------------------------------
  pull_request:
    - name: ci-pr
      docker:
        image: python:3.12-bookworm
      stages:
        - name: prepare
          script: |
            set -eu
            command -v make >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make)
            make setup

        - name: verify
          script: |
            set -eu
            make check

  # --------------------------------------------------------------------------
  # 云原生开发：从页面启动 WebIDE / VS Code Remote-SSH 时使用自定义开发环境
  #
  # 说明：
  #   - 镜像由 .ide/Dockerfile 构建；首次约 5~15 分钟，之后推送至制品库复用。
  #   - build.by 必须声明构建期用到的其它文件（.ide/settings.json），
  #     否则构建报错 —— 这是 CNB 的硬性约束。
  #   - image 为构建失败时的回退镜像。
  #   - services [vscode, docker]：分别启用 VS Code 服务与容器内 docker 命令。
  #   - 该事件下的 stages 会在开发环境启动后自动执行（此处仅做环境自检输出）。
  # --------------------------------------------------------------------------
  vscode:
    - name: dev-env
      runner:
        # 8 核 / 16 GiB 内存。免费额度为云原生开发-CPU 1600 核时/月，
        # 按 8 核 × 每天 8 小时 × 22 个工作日 = 1408 核时，属于可持续用量。
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          # build.by 必须列出**构建期用到的所有文件**，否则构建报错（CNB 硬性约束）。
          # 预置资产的清单与获取脚本（见 Dockerfile 第 10/11/12 阶段）。
          # 改动这些文件会改变构建输入 → 触发镜像重建。
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: welcome
          script: |
            set +e
            echo "=================================================="
            echo " 开发环境已就绪（自定义镜像 .ide/Dockerfile）"
            echo "=================================================="
            printf 'python : %s\n' "$(python -V 2>&1)"
            printf 'uv     : %s\n' "$(uv --version 2>&1)"
            printf 'node   : %s\n' "$(node -v 2>&1)"
            printf 'pnpm   : %s\n' "$(pnpm --version 2>&1)"
            printf 'cmake  : %s\n' "$(cmake --version 2>&1 | head -n1)"
            printf 'bwrap  : %s\n' "$(command -v bwrap || echo '缺失')"
            printf 'llama  : %s\n' "$(command -v llama-server || echo '缺失')"
            printf 'codebuddy: %s\n' "$(codebuddy --version 2>&1 | head -n1)"
            echo "--------------------------------------------------"
            echo "首次使用请执行：make setup && make check"
            echo "=================================================="

        - name: branch-hygiene
          script: |
            set +e
            # 为什么放在这里：开发环境每次从 develop 拉起、重启即清空上下文，
            # 未合入 develop 的工作在**下一次会话中不可见**（ADR-0013、devlog 0011）。
            # 放在启动阶段而不是靠人记，是这次丢内容事故的直接对策。
            # 只报告，不阻断——它不是质量门禁。
            echo "--------------------------------------------------"
            echo " 分支卫生自检（未合入 develop 的工作）"
            echo "--------------------------------------------------"
            make branch-status || echo "[warn] 分支自检未执行（不影响开发）"

# ============================================================================
# 基准自动化（仅挂在 bench/nightly 分支）
#
# 为什么单独一条分支（而不是挂在 develop 上）：
#   1. **crontab 只支持单一明确分支名**（不支持 glob），必须选一条；
#   2. 定时任务取**该分支 HEAD** 的代码 ⇒ 把测试代码与日常开发分开，
#      才能保证"同一份协议反复测"——协议一变，前后数据就不可比（ADR-0014）；
#   3. 数据写入独立的数据分支 `bench/data`，**不回写本分支**，
#      因此不存在"CI 推数据 → 又触发一轮测试"的死循环。
#
# 三种触发各司其职（互不遮挡，见 docs/engineering/benchmark-automation.md）：
#   push        —— 改了测试代码立刻跑一轮（R=3，S/M 两档，快速反馈）
#   crontab     —— 周二~周日 04:00 夜轮（R=10，三档）；周一 04:00 深跑（R=20 + 线程 4 对照）
#   web_trigger —— 手动补跑（页面上点一下，不改变量）
#
# 关键设计点：
#   - `runner.cpus: 8` ⇒ 内存 = 8 × 2 GiB = 16 GiB；**不能降到 4 核**：
#     L 档常驻 8.70 GiB，4 核只有 8 GiB，会 OOM（ADR-0014）；
#   - 复用 `.ide/Dockerfile` 的镜像（模型与 llama.cpp 已预置）：构建输入未变时命中
#     制品库缓存，因此 nightly 不必每晚重新下载 GB 级权重；
#   - `lock` 串行化：保证同一时刻**只有一轮**基准在跑，否则两个 runner 抢 CPU
#     会让吞吐数字失去可比性（这是数据有效性的要求，不是省钱）；
#   - 发布放在 `endStages`：即使测量阶段失败也把**已完成的部分数据**落盘
#     （半份数据比没有数据好，但会被标记为 partial）。
# ============================================================================
bench/nightly:
  # --------------------------------------------------------------------------
  # 推送即跑：验证新的测试代码能跑通，不求统计精度
  # --------------------------------------------------------------------------
  push:
    - name: bench-push
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
      lock:
        key: bench-cpu
        wait: true
        timeout: 3600
      stages:
        - name: verify
          script: |
            set -eu
            make setup
            make check
        - name: round-quick
          script: |
            set -eu
            make bench-round BENCH_TIERS=S,M BENCH_REPEATS=3 BENCH_LABEL=push
      endStages:
        - name: publish
          script: |
            set -u
            make bench-publish || echo "[warn] 数据发布失败（不影响本轮结论，但需查明）"

  # --------------------------------------------------------------------------
  # 夜轮：周二~周日 04:00（Asia/Shanghai）三档各重复 10 次
  # --------------------------------------------------------------------------
  "crontab: 0 4 * * 2-6,0":
    - name: bench-nightly
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
      lock:
        key: bench-cpu
        wait: true
        timeout: 3600
      stages:
        - name: prepare
          script: |
            set -eu
            make setup
        - name: round-nightly
          timeout: 90m
          script: |
            set -eu
            make bench-round BENCH_TIERS=S,M,L BENCH_REPEATS=10 BENCH_LABEL=nightly
      endStages:
        - name: publish
          script: |
            set -u
            make bench-publish || echo "[warn] 数据发布失败（不影响本轮结论，但需查明）"

  # --------------------------------------------------------------------------
  # 深跑：周一 04:00 —— 更多重复（20 次）+ 线程数对照（4 线程，R=5）
  #   线程 4 的轮次与线程 8 的轮次**不是同一条序列**（比较签名不同），
  #   用途是回答"核数变少时该降哪一档"，即 REQ-PERF-05/06 的取数。
  # --------------------------------------------------------------------------
  "crontab: 0 4 * * 1":
    - name: bench-deep
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
      lock:
        key: bench-cpu
        wait: true
        timeout: 7200
      stages:
        - name: prepare
          script: |
            set -eu
            make setup
        - name: round-deep
          timeout: 150m
          script: |
            set -eu
            make bench-round BENCH_TIERS=S,M,L BENCH_REPEATS=20 BENCH_LABEL=deep
        - name: round-threads4
          timeout: 60m
          script: |
            set -eu
            make bench-round BENCH_TIERS=S,M,L BENCH_REPEATS=5 BENCH_THREADS=4 BENCH_LABEL=deep-t4
      endStages:
        - name: publish
          script: |
            set -u
            make bench-publish || echo "[warn] 数据发布失败（不影响本轮结论，但需查明）"

  # --------------------------------------------------------------------------
  # 手动补跑：页面上点一下即可（不改变量，等价于夜轮）
  # --------------------------------------------------------------------------
  web_trigger_bench:
    - name: bench-manual
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          by:
            - .ide/settings.json
            - .ide/assets/models.txt
            - .ide/assets/benchmarks.txt
            - .ide/assets/references.txt
            - .ide/fetch-assets.sh
      lock:
        key: bench-cpu
        wait: true
        timeout: 3600
      stages:
        - name: prepare
          script: |
            set -eu
            make setup
        - name: round-manual
          timeout: 90m
          script: |
            set -eu
            make bench-round BENCH_TIERS=S,M,L BENCH_REPEATS=5 BENCH_LABEL=manual
      endStages:
        - name: publish
          script: |
            set -u
            make bench-publish || echo "[warn] 数据发布失败（不影响本轮结论，但需查明）"

