# ============================================================================
# 项目元数据与工具链配置
#
# 注意：本文件当前为「工程基线」，用于统一代码风格、类型检查、测试与提交规范。
#      项目名与依赖集合将在 base project 选型冻结后（见 docs/proposals/0001-*.md）
#      全面对齐，届时通过 ADR 记录变更。
# ============================================================================

[build-system]
# D7 已决（2026-09-19，所有者批准）：采用 `hatchling`。
# 依据：ADR-0015 §8.2.1 的 `V-a` —— **MIT**、**纯 Python**（`py3-none-any`）、
#      运行期依赖均为成熟纯 Python 包（packaging / pathspec / pluggy / tomlkit / trove-classifiers）。
# 否决另两个候选的理由（ADR-0015 §8.1 的 D7 原候选）：`setuptools` 需更多显式配置、
#      历史上更易出现"文件包含/排除"歧义；`uv_build` 绑定 uv 单一构建器，
#      与其他 PEP 517 工具链的互操作性未核验（**未核验 ⇒ 不采用**）。
# 影响：项目自本次起**可被打包安装**（`uv build`），解除 `REQ-UX-03`（一条命令安装）
#      与 `REQ-OPS-04`（可复现构建）的阻塞。
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 显式声明包位置（仓库为 src 布局），避免依赖 hatchling 的名称推断。
packages = ["src/agent_sec_perf"]

[project]
name = "agent-sec-perf"
# 版本号**不由提交历史推导**：它只能取 `[tool.lowspec.releases]` 台账里列出的里程碑值。
# 当前 `0.0.0` = **尚未到达第一个里程碑**（第一个里程碑是 `0.0.1`「框架搭完」）。
# 落定方式：`make release VERSION=x.y.z`（流程见 docs/engineering/git-workflow.md §5，
# 决策见 docs/adr/0019-release-and-version-policy.md）；`make bump` 已被改为拒绝执行。
# 本值有 **4 处副本**（本行 / [tool.commitizen].version / src/agent_sec_perf/__init__.py /
# uv.lock），一致性由 tests/unit/test_release_policy.py 机器检查。
version = "0.0.1"
description = "原生智能系统的安全与加速工程实践（项目代号 TBD）"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Le0n3rd" }]
keywords = ["agent", "security", "performance", "systems"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
]

# 运行期依赖：依据 ADR-0015 §5.2 的组件清单（所有者于 2026-09-18 批准 D1~D10）
#            + §8.2.1 的核验结果（2026-09-19，14 项核验完成、§7.4 的可安装性与类型兼容已过）
#            ⇒ 此处只填"已批准且已核验"的组件，**精确版本以 uv.lock 为准**。
# 注意：本项目的 `[build-system]`（D7 构建后端）**尚未决定**，故此处不动构建配置；
#       不在此列出：openai SDK / httpx / Textual / llama-cpp-python / MCP SDK /
#       LLM Guard / 向量库 / 任何 agent 编排框架（理由见 ADR-0015 §5.2.6）。
#       `tomllib` 属标准库，不写入依赖。
dependencies = [
    "typer>=0.27",               # A1 · CLI 框架（REQ-UX-01）；0.26+ 内嵌 Click，无 click 依赖
    "rich>=15.0",                # A2 · 终端渲染（Typer 的传递依赖，独立声明以便显式使用）
    "pydantic>=2.13",            # B1 · **仅两处用途**：信任边界校验 + 工具参数 JSON Schema（D2）
    "platformdirs>=4.11",        # C2 · 跨平台用户目录（REQ-PLAT-01）
    "urllib3>=2.8",              # HTTP-1 · 云端模型薄客户端（D3）
    "structlog>=26.1",           # E1 · 结构化日志与脱敏管线（REQ-OBS-01 / REQ-SEC-07）
    "tree-sitter>=0.26",         # F1 · 语法层（REQ-PERF-02/03）
    "tree-sitter-python>=0.25",  # F1 · Python 语法包（与主包 0.26 运行期实测兼容）
]

[project.optional-dependencies]
# 开发依赖（`make setup` 会安装）
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "commitizen>=3.29",
    "pre-commit>=3.8",
]
# 安全与审计依赖
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
]

# ============================================================================
# 代码风格与静态检查：Ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "third_party",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print（禁止遗留调试打印）
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff 自有规则
    "S",   # flake8-bandit：安全相关静态检查
]
ignore = [
    "E501", # 行宽由 formatter 保证
    "S101", # 允许在测试中使用 assert
]
# 中文标点不属于「歧义字符」：RUF001/RUF002/RUF003 默认会把全角括号、逗号、冒号、
# 分号、问号、叹号与中文引号视为「疑似误输入的全角字符」，但本项目的文档与注释
# 使用中文，这些恰是正确的全角用法。此处按**字符白名单**放行，而不是关闭整条规则，
# 以保留对真正同形字的检测——例如西里尔字母 а (U+0430) 冒充拉丁 a、全角拉丁字母 Ａ。
# 依据：2026-09-15 的 RUF 探针实测，见 docs/devlog/0006 §4.3。
allowed-confusables = [
    "，", "。", "、", "：", "；", "？", "！",
    "（", "）", "《", "》", "“", "”", "‘", "’",
    "…", "—", "～",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]   # 测试中允许使用断言与打印
"scripts/**/*.py" = ["T20"]      # 脚本允许向终端输出

[tool.ruff.lint.isort]
known-first-party = ["agent_sec_perf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# 类型检查：mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ============================================================================
# 测试：pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Phase 0：暂不打包安装，直接以 src 作为导入根；正式打包方式随 base project 确定。
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "security: 安全与对抗性测试",
    "benchmark: 性能基准测试（默认不参与快速回归）",
    "slow: 耗时较长的测试",
]

# ============================================================================
# 提交规范：commitizen（Conventional Commits）
# ============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
# 版本号共 4 处副本，其中两处（本文件 / 包内 `__version__`）由本字段同步；
# `uv.lock` 的那份由 `uv lock` 同步（`make release` 会跑）。缺任何一处都会被
# `tests/unit/test_release_policy.py` 拦下——这正是"忘了一处"不再能静默通过的原因。
version_files = ["pyproject.toml:^version", "src/agent_sec_perf/__init__.py:__version__"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
annotated_tag = true
# 安全网（一致性报告 A-17 的处置）：缺省 `False` 会把 `feat!:` / `BREAKING CHANGE`
# 直接推到 `1.0.0`；而本项目 Phase 0 内**不得出现 `1.0.0`**（版本阶梯见下）。
# 置 `true` 后破坏性变更只动 MINOR，因此**即使有人误跑** `cz bump` 也越不过 0.x。
major_version_zero = true

# ============================================================================
# 版本里程碑台账（发布口径的**唯一机器真源**）
#
# 版本号不表达"改了多少提交"，只表达"**到达了哪个里程碑**"。
# 判据必须**可核对**（能回答"到没到"），否则就会退回到"感觉差不多可以发版了"。
# 落定流程：`make release VERSION=x.y.z` —— 且只能落在本表列出的值上；
# 机器检查见 tests/unit/test_release_policy.py，完整口径见 docs/engineering/git-workflow.md §5。
#
# ⚠️ 新增里程碑 = 一次**显式**决策：必须同时给出可核对的判据，并在 PR / ADR 中说明来源。
# ============================================================================
[[tool.lowspec.releases.milestones]]
version = "0.0.0"
name = "工程基线（未发布）"
criteria = "工程骨架与流程规范就位；**不产生标签**，仅表示尚未到达第一个里程碑"

[[tool.lowspec.releases.milestones]]
version = "0.0.1"
name = "框架搭完"
criteria = "M0 出口准则全部达成（docs/engineering/sdlc.md §3.1 的 G1~G9，其中 G9 分层不变性为机器检查）"

[[tool.lowspec.releases.milestones]]
version = "0.1.0"
name = "首个可用版本"
criteria = "端到端可跑：能完成一次完整 agent 会话（简单 CLI 交互 + 调用工具 + 审计可回放）"

# ============================================================================
# 覆盖率
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ============================================================================
# 安全静态扫描：Bandit
# 说明：本项目为安全方向项目，Bandit 规则整体保持严格；
#      确需豁免的场景：豁免标记行只写规则号（`# nosec B404` / `# noqa: S603`），
#      理由写在紧邻其上的独立注释行（禁止在标记后追加自由文本——会被当作规则号而静默放宽检查），
#      并登记到安全豁免登记表（`docs/adr/0014-benchmark-automation.md` §2.9）。
#
# 2026-09-18：此处原有 `[tool.bandit]` 段（`targets` / `exclude_dirs` / `skips = ["B101"]`），
#  **已删除**，且**不保留任何 Bandit 配置**。原因：
#  `make check` 的 `security-bandit` 目标执行 `bandit -q -r src`（**不读配置**），
#  而 pre-commit 钩子执行 `bandit -c pyproject.toml …`（**读配置**）
#  ⇒ 同一份代码在两处门禁下的**规则集不同**，配置里的 `skips` 只在本地钩子生效。
#  这会造成"钩子绿、make check 红"（或反之）的两套口径，且真实强度取较松的一处。
#  处置：**两处统一为"不读配置文件"**，规则集一致，且因不再跳过 B101 而**强度不降**。
#  子进程执行仍是本项目核心能力，因此**不**整体禁用 B603/B607（改为要求所有调用点
#  显式经过封装层，见 `.codebuddy/rules/security-baseline`）——该立场由代码内豁免标记
#  与上条登记表承载，**不**依赖本文件的配置。
#  若将来确需 Bandit 配置，**必须两处门禁同时引用同一份配置**，并在本段说明理由。
# ============================================================================
