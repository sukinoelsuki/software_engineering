# ============================================================================
# 项目元数据与工具链配置
#
# 注意：本文件当前为「工程基线」，用于统一代码风格、类型检查、测试与提交规范。
#      项目名与依赖集合将在 base project 选型冻结后（见 docs/proposals/0001-*.md）
#      全面对齐，届时通过 ADR 记录变更。
# ============================================================================

[project]
name = "agent-sec-perf"
version = "0.1.0"
description = "原生智能系统的安全与加速工程实践（项目代号 TBD）"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Le0n3rd" }]
keywords = ["agent", "security", "performance", "systems"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
]

# 运行期依赖：待 base project 选定后填充，当前保持为空以避免过早锁定技术栈。
dependencies = []

[project.optional-dependencies]
# 开发依赖（`make setup` 会安装）
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "commitizen>=3.29",
    "pre-commit>=3.8",
]
# 安全与审计依赖
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
]

# ============================================================================
# 代码风格与静态检查：Ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "third_party",
    "vendor",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print（禁止遗留调试打印）
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff 自有规则
    "S",   # flake8-bandit：安全相关静态检查
]
ignore = [
    "E501", # 行宽由 formatter 保证
    "S101", # 允许在测试中使用 assert
]
# 中文标点不属于「歧义字符」：RUF001/RUF002/RUF003 默认会把全角括号、逗号、冒号、
# 分号、问号、叹号与中文引号视为「疑似误输入的全角字符」，但本项目的文档与注释
# 使用中文，这些恰是正确的全角用法。此处按**字符白名单**放行，而不是关闭整条规则，
# 以保留对真正同形字的检测——例如西里尔字母 а (U+0430) 冒充拉丁 a、全角拉丁字母 Ａ。
# 依据：2026-09-15 的 RUF 探针实测，见 docs/devlog/0006 §4.3。
allowed-confusables = [
    "，", "。", "、", "：", "；", "？", "！",
    "（", "）", "《", "》", "“", "”", "‘", "’",
    "…", "—", "～",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]   # 测试中允许使用断言与打印
"scripts/**/*.py" = ["T20"]      # 脚本允许向终端输出

[tool.ruff.lint.isort]
known-first-party = ["agent_sec_perf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# 类型检查：mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ============================================================================
# 测试：pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Phase 0：暂不打包安装，直接以 src 作为导入根；正式打包方式随 base project 确定。
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "security: 安全与对抗性测试",
    "benchmark: 性能基准测试（默认不参与快速回归）",
    "slow: 耗时较长的测试",
]

# ============================================================================
# 提交规范：commitizen（Conventional Commits）
# ============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:^version"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
annotated_tag = true

# ============================================================================
# 覆盖率
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ============================================================================
# 安全静态扫描：Bandit
# 说明：本项目为安全方向项目，Bandit 规则整体保持严格；
#      确需豁免的场景：豁免标记行只写规则号（`# nosec B404` / `# noqa: S603`），
#      理由写在紧邻其上的独立注释行（禁止在标记后追加自由文本——会被当作规则号而静默放宽检查），
#      并登记到安全豁免登记表（`docs/adr/0014-benchmark-automation.md` §2.9）。
# ============================================================================
[tool.bandit]
targets = ["src"]
exclude_dirs = [".venv", "build", "dist", "tests", "third_party", "vendor"]
# 子进程执行是本项目的核心能力之一，因此不整体禁用 B603/B607；
# 改为要求所有调用点显式经过封装层（见 .codebuddy/rules/security-baseline）。
skips = ["B101"]
