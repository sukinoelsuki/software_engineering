name: 功能需求
description: 提出一项新功能或能力增强需求
title: "[Feature] "
labels: ["enhancement"]
assignees: ["Le0n3rd"]
body:
  - type: markdown
    attributes:
      value: |
        需求必须能回答"为什么值得做"，否则不予受理。请务必填写**验收标准**——
        没有可验证验收标准的需求无法进入开发流程。

  - type: textarea
    attributes:
      label: 需求背景
      description: 当前存在什么问题？为什么现在要做？
      placeholder: 描述痛点、使用场景与不做的代价
    validations:
      required: true

  - type: textarea
    attributes:
      label: 目标能力
      description: 用一句话描述希望系统具备的能力
    validations:
      required: true

  - type: textarea
    attributes:
      label: 验收标准
      description: 可验证、可测量的完成条件（每条都应能被测试或演示）
      placeholder: |
        - [ ] 当 ... 时，系统应 ...
        - [ ] 在 ... 场景下，P95 延迟不高于 ... ms
    validations:
      required: true

  - type: textarea
    attributes:
      label: 安全与性能影响
      description: 是否会引入新的信任边界、外部输入、权限提升？是否影响性能？如何度量？
    validations:
      required: true

  - type: textarea
    attributes:
      label: 备选方案
      description: 考虑过哪些其他做法？为什么不选？
    validations:
      required: false

  - type: dropdown
    attributes:
      label: 所属主线
      multiple: true
      options:
        - 原生智能系统（架构 / 运行时）
        - 系统安全
        - 加速与优化
        - 工程与流程
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 优先级
      options:
        - P0 本迭代必须完成
        - P1 本迭代尽量完成
        - P2 下迭代候选
        - P3 便利贴（长期）
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue 与文档，确认不是重复需求
          required: true
        - label: 验收标准可被客观验证
          required: true
