name: 缺陷报告
description: 报告一个可复现的缺陷（非安全漏洞）
title: "[Bug] "
labels: ["bug"]
assignees: ["Le0n3rd"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：**安全漏洞不要使用本模板**，请按 [SECURITY.md](../../SECURITY.md) 的私密渠道报告。

  - type: input
    attributes:
      label: 版本 / 提交
      description: 出现问题的版本号或提交哈希（`git rev-parse --short HEAD`）
      placeholder: 例如 v0.1.0 或 a1b2c3d
    validations:
      required: true

  - type: input
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、相关依赖版本、硬件（如涉及性能）
      placeholder: 例如 Linux 6.8 / Python 3.12.4 / 16C32G
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      description: 请给出最小可复现步骤，越具体越好
      placeholder: |
        1. 执行 ...
        2. 设置 ... 为 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际行为
      description: 包含完整的错误信息与堆栈
    validations:
      required: true

  - type: textarea
    attributes:
      label: 日志 / 堆栈
      render: text
      placeholder: 粘贴完整日志。注意：请先脱敏，移除任何密钥、令牌与个人数据。
    validations:
      required: false

  - type: dropdown
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 正确性（结果错误）
        - 安全性（隔离 / 权限 / 校验）
        - 性能（延迟 / 吞吐 / 内存）
        - 稳定性（崩溃 / 挂起 / 泄漏）
        - 可观测性（日志 / 指标 / 审计）
        - 文档 / 工程配置
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 严重程度
      options:
        - S1 阻塞（无法使用 / 数据损坏）
        - S2 严重（核心功能受损，有绕过方式）
        - S3 一般（影响体验，不阻塞主流程）
        - S4 轻微（体验瑕疵）
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 已在最新代码上复现
          required: true
        - label: 日志与截图已脱敏，不含密钥或个人数据
          required: true
