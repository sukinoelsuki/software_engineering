# AI coding 笔试领域包（声明式，无代码 —— 目录内出现 .py/.pyc/__pycache__ 会被拒绝加载）。
#
# ⚠️ 安全口径（**必读**，依据 docs/adr/0033-ai-coding-exam-kit.md）：
#    本包把 write_file 与 run_command 声明为 low（自动放行），这是**下调安全默认**，
#    只允许用于"本机、自己发起的笔试"这一场景。它**不得**被照抄进 examples/packs/
#    （那里的用例 tests/unit/test_example_packs.py 会因此翻红），也不得用于
#    "在不可信机器上跑不可信模型"。缓解手段见 ADR-0033 §安全权衡：
#    default-deny 能力授予、路径白名单（工作目录 + 本包目录）、非特权 uid 执行 + rlimit、
#    全过程审计可回放。
#
# 键与形状见 docs/design/interfaces/harness.md §4.2；加载实现见 harness/domain_pack.py。

[pack]
name = "coding-exam"
version = "0.1.0"
description = "AI coding 笔试：读写源码 + 编译执行（限工作目录）"

[prompt]
# ⚠️ 有意**留空**（2026-10-10，所有者下达）：本包零引导。
#
# 早先这里预置过四条片段（【路径】【流程】【证据】【调用风格】，对应实测踩到的三类坑）。
# 它们把"用相对路径 / 先编译再运行 / 别在回答里直接贴输出 / gcc 参数给列表"直接喂给模型，
# 等于**替人和模型把需求分析与流程拆解做完了**——而那一件事正是 AI coding 笔试要考的：
# 人自己判断从哪开始、怎么拆、通过对话把活干完。片段进了指令面，考点就没了。
# 因此改为空列表：模型只拿到工具清单与题面本身，其余靠对话。
#
# ⚠️ **不要"顺手补回来"**。要加回来必须先说明"为什么这不是替模型做题"。
# 被移除的四条原文存档在 docs/devlog/0030-*.md（便于追溯，不进产品）。
#
# （形状说明：`fragments` 是可选键，≤ 8 条、单条 ≤ 2000 字符；空列表 ⇒ 不产生数据消息，
#   见 harness/domain_pack.py 与 tests/unit/test_harness_prompts.py。）
fragments = []

[tools]
allowlist = ["read_file", "list_dir", "write_file", "run_command"]

[security]
capabilities = ["read_file", "write_file", "execute_command"]

[security.risk_overrides]
read_file = "low"
list_dir = "low"
write_file = "low"
run_command = "low"

[output]
format = "text"
