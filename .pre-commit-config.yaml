# 本地提交前门禁（first line of defense）
# 安装：make setup 会自动执行 `pre-commit install --hook-type commit-msg`
# 手动全量运行：pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
#
# ⚠️ 【版本对齐规则，必须遵守】
#   本节各 hook 的 `rev` **必须与 `uv.lock` 锁定的版本一致**——`uv.lock` 是唯一事实来源。
#   pre-commit 的 hook 运行在各自独立的虚拟环境里，因此它可以和项目环境装到**不同版本**
#   的工具，从而出现「钩子绿、`make check` 红」这类不一致。
#
#   这不是假设：2026-09-15 的归档提交就因此被卡住——pre-commit 的 ruff **0.6.9**
#   不格式化 Markdown 内嵌的 Python 代码块，而 `uv sync` 装的 ruff **0.16.7** 会。
#   见 docs/devlog/0007 §2.6（卡点 T-1）。
#
#   因此：**升级依赖时（`make setup` 后）必须同步更新本文件中的 `rev`**，
#   并执行 `pre-commit run --all-files` 与 `make check` 双确认。
#
#   已知例外：`pre-commit-hooks`（通用文件卫生）与项目依赖无对应关系，不受本规则约束。

repos:
  # ---------------------------------------------------------------------------
  # 通用文件卫生
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-json
        # 例外：.ide/settings.json 是 VS Code 设置文件，按编辑器与平台约定使用
        # JSONC（允许注释），必然无法通过 JSON 解析。该文件的合法性由 VS Code
        # 自身在运行时报错，不需静态校验。
        # 决策与影响评估见 docs/devlog/0006 §2.4.4 与 V-8。
        exclude: '^\.ide/settings\.json$'
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^\.cnb\.yml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: forbid-submodules
      - id: no-commit-to-branch
        # 只保护 main：develop 已改为**工作主干**、允许直接提交（ADR-0013）。
        # 理由：单人开发无并行工作流，而云环境每次从 develop 拉起、重启即清空
        # 上下文——留在短期分支上的工作下次会话"不存在"，本次已因此丢过内容。
        # 防误提交改由 Conventional Commits、本文件其余钩子、make check 与 CI 承担。
        args: ["--branch=main"]

  # ---------------------------------------------------------------------------
  # 代码风格与静态检查
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 对齐 uv.lock 的 ruff 0.16.7（原为 v0.6.9，行为不同，见文件头说明）
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 类型检查
  # ---------------------------------------------------------------------------
  # 2026-09-19（`F` 类，所有者批准；登记见 docs/engineering/security-scan-gate-config.md §8）：
  # **由 `mirrors-mypy` 改为 `repo: local` + `language: system` + `uv run mypy`。**
  # 原因：`mirrors-mypy` 的钩子环境是**独立 venv**，且 `additional_dependencies: []`
  # ⇒ **只有 mypy、没有运行期依赖** ⇒ 任何 import 第三方库的 `src/` 模块一律被报
  # `import-not-found`（**构造性假红**），而 `make check` 的 typecheck 走项目 venv（真绿）
  # ⇒ **两处门禁口径相反**（同族的第三次实例）。现改为与 `make check` 的 `typecheck`
  # **同一解释器、同一依赖集合、同一调用形态**（`Makefile` 的 `typecheck` 目标就是 `uv run mypy`）。
  # **净强度不变**（跑的是同一条命令）。
  # `pass_filenames: false` 是**刻意的**：`make check` 的 mypy 由 `pyproject.toml` 的
  # `files = ["src"]` 决定扫描范围；若把改动文件名传给 mypy，模块解析与 `follow-imports`
  # 行为会与门禁不一致 ⇒ **两处又不一致**。
  # 新增不变式（`security-scan-gate-config.md` §8.1）：**同一工具的钩子与 `make check`
  # 必须运行在同一依赖集合下**；只差一处依赖即可产生"假红"或"漏检"。
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy（与 make check 的 typecheck 同源）
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/

  # ---------------------------------------------------------------------------
  # 提交信息规范（Conventional Commits）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    # 对齐 uv.lock 的 commitizen 4.18.1（原为 v3.29.1）
    rev: v4.18.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ---------------------------------------------------------------------------
  # 安全：静态扫描（Bandit）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    # 对齐 uv.lock 的 bandit 1.9.4（原为 1.7.10）；注意该仓库标签无 `v` 前缀
    rev: 1.9.4
    hooks:
      - id: bandit
        # 2026-09-18：去掉 `-c pyproject.toml`。该参数使本钩子**读配置**（含 `skips = ["B101"]`），
        # 而 `make check` 的 `security-bandit` 目标执行 `bandit -q -r src`（**不读配置**）
        # ⇒ 同一份代码在两处门禁下的规则集不同，且配置只在本地钩子生效。
        # 现统一为"**不读配置文件**"：两处规则集一致，且不保留任何 skips ⇒ 强度不降（B101 重新被检查）。
        # 详见 pyproject.toml 中 Bandit 段落的说明与探针证据（docs/engineering/ 的 bandit 登记条）。
        args: ["-q", "-r", "src"]
        files: ^src/.*\.py$
        pass_filenames: false
