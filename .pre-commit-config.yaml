# 本地提交前门禁（first line of defense）
# 安装：make setup 会自动执行 `pre-commit install --hook-type commit-msg`
# 手动全量运行：pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # 通用文件卫生
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-json
        # 例外：.ide/settings.json 是 VS Code 设置文件，按编辑器与平台约定使用
        # JSONC（允许注释），必然无法通过 JSON 解析。该文件的合法性由 VS Code
        # 自身在运行时报错，不需静态校验。
        # 决策与影响评估见 docs/devlog/0006 §2.4.4 与 V-8。
        exclude: '^\.ide/settings\.json$'
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^\.cnb\.yml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: forbid-submodules
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=develop"]

  # ---------------------------------------------------------------------------
  # 代码风格与静态检查
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 类型检查
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: ["--config-file=pyproject.toml"]
        files: ^src/

  # ---------------------------------------------------------------------------
  # 提交信息规范（Conventional Commits）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ---------------------------------------------------------------------------
  # 安全：静态扫描（Bandit）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-q", "-r", "src"]
        files: ^src/.*\.py$
        pass_filenames: false
